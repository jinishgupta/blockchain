<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login / Signup Flip</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen overflow-hidden">

  <!-- Animated Background -->
  <div id="bg" class="absolute inset-0 animate-none bg-gradient bg-[length:200%_100%] transition-all duration-700"></div>

  <!-- Card Container -->
  <div class="perspective w-full max-w-md h-[480px] relative z-10">
    <div id="flipCard" class="flip-card-inner w-full h-full relative">

      <!-- Sign In Side -->
      <div class="flip-card-front bg-white rounded-3xl shadow-xl p-10 flex flex-col justify-center">
        <h2 class="text-3xl font-bold mb-6 text-center text-gray-800">Welcome Back</h2>
        <form onsubmit="signIn(event)" class="space-y-5">
          <input type="text" id="signin-username" placeholder="Username" required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm hover:shadow-md focus:outline-none focus:ring-2 focus:ring-blue-400 transition duration-200" />
          <input type="password" id="signin-password" placeholder="Password" required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm hover:shadow-md focus:outline-none focus:ring-2 focus:ring-blue-400 transition duration-200" />
          <button type="submit"
            class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold
                   transition-all duration-300 ease-in-out
                   hover:bg-blue-700 hover:shadow-md hover:scale-[1.02]
                   active:scale-[0.98]
                   focus:outline-none focus:ring-2 focus:ring-blue-300">
            Sign In
          </button>
        </form>
        <p id="signin-message" class="mt-4 text-center text-sm font-medium text-gray-700"></p>
        <p class="text-sm mt-6 text-center text-gray-600">
          Don’t have an account?
          <button onclick="flipCard()" class="text-blue-600 font-semibold hover:underline">Sign Up</button>
        </p>
      </div>

      <!-- Sign Up Side -->
      <div class="flip-card-back bg-white rounded-3xl shadow-xl p-10 flex flex-col justify-center">
        <h2 class="text-3xl font-bold mb-6 text-center text-gray-800">Create Account</h2>
        <form onsubmit="signUp(event)" class="space-y-5">
          <input type="text" id="signup-username" placeholder="Username" required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm hover:shadow-md focus:outline-none focus:ring-2 focus:ring-blue-400 transition duration-200" />
          <input type="password" id="signup-password" placeholder="Password" required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm hover:shadow-md focus:outline-none focus:ring-2 focus:ring-blue-400 transition duration-200" />
          <button type="submit"
            class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold
                   transition-all duration-300 ease-in-out
                   hover:bg-blue-700 hover:shadow-md hover:scale-[1.02]
                   active:scale-[0.98]
                   focus:outline-none focus:ring-2 focus:ring-blue-300">
            Sign Up
          </button>
        </form>
        <p id="signup-message" class="mt-4 text-center text-sm font-medium text-gray-700"></p>
        <p class="text-sm mt-6 text-center text-gray-600">
          Already have an account?
          <button onclick="flipCard()" class="text-blue-600 font-semibold hover:underline">Sign In</button>
        </p>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
